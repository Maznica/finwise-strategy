<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>FinWise collaboration growth loop</title>
  <desc>A six-stage cycle: a small-business owner starts a trial and connects bank data, invites their accountant to a free review seat, the account becomes a shared workspace, it converts to a paid seat-based plan and retains, the accountant then adopts FinWise across their own client book, and new pre-sold owners arrive, restarting the loop.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>

  <text x="40" y="34" font-size="15" font-weight="600" fill="#2C2C2A">FinWise Co. — collaboration growth loop</text>

  <rect x="40" y="56" width="180" height="76" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="88" font-size="14" font-weight="600" fill="#444441" text-anchor="middle">Owner starts trial</text>
  <text x="130" y="108" font-size="12" fill="#5F5E5A" text-anchor="middle">Connects bank data</text>

  <rect x="250" y="56" width="180" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="88" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Invites accountant</text>
  <text x="340" y="108" font-size="12" fill="#0F6E56" text-anchor="middle">Free review seat</text>

  <rect x="460" y="56" width="180" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="550" y="88" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Shared workspace</text>
  <text x="550" y="108" font-size="12" fill="#0F6E56" text-anchor="middle">Both work in it</text>

  <rect x="460" y="216" width="180" height="76" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="550" y="248" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">Seat-based upgrade</text>
  <text x="550" y="268" font-size="12" fill="#534AB7" text-anchor="middle">Pays, and stays</text>

  <rect x="250" y="216" width="180" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="248" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Accountant adopts</text>
  <text x="340" y="268" font-size="12" fill="#0F6E56" text-anchor="middle">Uses it with clients</text>

  <rect x="40" y="216" width="180" height="76" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="248" font-size="14" font-weight="600" fill="#444441" text-anchor="middle">New owners arrive</text>
  <text x="130" y="268" font-size="12" fill="#5F5E5A" text-anchor="middle">Referred, pre-sold</text>

  <g stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="222" y1="94"  x2="246" y2="94"  marker-end="url(#arrow)"/>
    <line x1="432" y1="94"  x2="456" y2="94"  marker-end="url(#arrow)"/>
    <line x1="550" y1="136" x2="550" y2="212" marker-end="url(#arrow)"/>
    <line x1="458" y1="254" x2="434" y2="254" marker-end="url(#arrow)"/>
    <line x1="248" y1="254" x2="224" y2="254" marker-end="url(#arrow)"/>
    <line x1="130" y1="212" x2="130" y2="136" marker-end="url(#arrow)"/>
  </g>

  <rect x="40"  y="324" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="58"  y="334" font-size="12" fill="#5F5E5A">Entry point</text>
  <rect x="160" y="324" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="178" y="334" font-size="12" fill="#5F5E5A">User action</text>
  <rect x="290" y="324" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="308" y="334" font-size="12" fill="#5F5E5A">Revenue + retention</text>

  <text x="40" y="370" font-size="11" fill="#888780">Trigger: owner connects bank data and generates a first cash-flow report. Output that restarts the loop: the accountant's client book.</text>
</svg>
